name: STAGING - Fetch OIDC Clients (Hourly)

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:

permissions: {}

jobs:
  fetch-oidc-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Make scripts executable
        run: chmod +x scripts/fetch-oidc-clients-from-github.sh

      - name: Fetch OIDC clients
        env:
          ENVIRONMENT: staging
          GITHUB_TOKEN: ${{ secrets.PING_CONFIG_GITHUB_TOKEN }}
        run: ./scripts/fetch-oidc-clients-from-github.sh

      - name: Check for changes
        id: changes
        run: |
          git config user.name "OIDC Sync Bot"
          git config user.email "oidc-sync@company.com"
          git add public/oidc-clients/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "chore(staging): update OIDC clients $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin main
